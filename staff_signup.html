<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        function validatePassword() {
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirm_password").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return false; // Prevent form submission if passwords don't match
            }
            return true; // Proceed with form submission
        }
    </script>
</head>
<body>

    <div class="container">
        <div class="left-section">
            <img src="image.png" alt="Signup Image">
        </div>

        <div class="right-section">
            <div class="form-box">
                <h2>Staff Sign Up</h2>
                <form id="signupForm" action="staff_signup.php" method="POST" onsubmit="return validatePassword()">
                    <input type="text" name="name" placeholder="Enter Full Name" required>
                    <input type="text" name="sdrn" placeholder="Enter SDRN (or Faculty ID)" required>
                    <input type="text" name="department" placeholder="Enter Department" required>
                    <input type="text" name="phone_number" placeholder="Enter Phone Number" required>
                    <input type="email" name="email" placeholder="Enter Email ID" required>

                    <input type="password" id="password" name="password" placeholder="Enter Password" required>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>

                    <button type="submit">Sign Up</button>
                </form>
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>

</body>
</html>
